entity: Asset
label: 資產

source:
  node_label: Asset

properties:
  asset_code: {column: asset_code, type: string, searchable: true}
  name: {column: name, type: string, searchable: true}
  quantity: {column: quantity, type: number}
  status: {column: status, type: string, searchable: true}
  specification: {column: specification, type: string, searchable: true, fulltext: true}
  note: {column: note, type: string, searchable: true, fulltext: true}

relations:
  category:
    label: 財產類別
    relationship_type: BELONGS_TO
    direction: outgoing
    target:
      entity: Category
    display:
      property: name

  location:
    label: 存放地點
    relationship_type: STORED_AT
    direction: outgoing
    target:
      entity: Location
    display:
      property: name