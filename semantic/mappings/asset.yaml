entity: Asset
label: 資產

source:
  node_label: Asset

# ---- 新增：建置階段設定 ----
ingestion:
  source_type: sqlite        # 這個 entity 的資料要從哪裡讀
  source_table: assets       # SQLite 裡的表名
  # 如果之後這個 entity 改從 Google Sheet 讀，只要改成：
  # source_type: google_sheets
  # sheet_name: Assets

properties:
  asset_code: {column: asset_code, type: string, searchable: true}
  name: {column: name, type: string, searchable: true}
  quantity: {column: quantity, type: number}
  status: {column: status, type: string, searchable: true}
  specification: {column: specification, type: string, searchable: true, fulltext: true}
  note: {column: note, type: string, searchable: true, fulltext: true}

relations:
  category:
    label: 財產類別
    relationship_type: BELONGS_TO
    # ---- 新增：建置階段怎麼知道要連去哪個 Category 節點 ----
    ingestion:
      foreign_key: category_id   # SQLite 來源表裡的外鍵欄位
      target_key: id              # 對應到 Category 節點的哪個屬性
    target:
      entity: Category
    display:
      property: name

  location:
    label: 存放地點
    relationship_type: STORED_AT
    ingestion:
      foreign_key: location_id    # ← 檢查這個有沒有漏掉
    target:
      entity: Location
    display:
      property: name